<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manpower Services</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    /* HEADER */
    .header {
      display: flex;
      flex-wrap: wrap; /* ✅ allows stacking on mobile */
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background-color: #007bff;
      color: white;
    }
    .logo-container {
      display: flex;
      flex-wrap: wrap; /* ✅ stack catchline & logo on mobile */
      align-items: center;
      gap: 15px;
      flex: 1;
      min-width: 250px;
    }
    .catchline-purpose {
      text-align: left;
      max-width: 100%; /* ✅ full width on small screens */
    }
    .catchline {
      font-size: 16px;
      font-weight: bold;
    }
    .purpose {
      font-size: 14px;
      margin-top: 5px;
    }
    .logo {
      max-width: 120px; /* ✅ smaller on mobile */
      height: auto;
    }
    .header img {
      max-width: 100%;
      height: auto;
    }

    /* SERVICES BUTTONS */
    .services {
      display: flex;
      flex-wrap: wrap; /* ✅ makes buttons wrap */
      justify-content: center;
      gap: 10px;
      margin: 15px;
    }
    .services button {
      flex: 1 1 120px; /* ✅ auto resize buttons */
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
    }

    /* WORKER CARDS */
    .worker-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 20px;
    }
    .worker-card {
      background: white;
      padding: 15px;
      width: 100%;
      max-width: 300px; /* ✅ prevents overflow */
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .worker-card img {
      width: 100%; /* ✅ responsive image */
      max-height: 350px;
      object-fit: cover; /* ✅ keeps proportion */
      border-radius: 10px;
    }
    .book-button {
      margin-top: 10px;
      padding: 8px 15px;
      font-size: 14px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* FOOTER */
    .footer {
      margin-top: 30px;
      background-color: #007bff;
      color: white;
      padding: 10px;
      font-size: 14px;
    }

    /* ✅ MOBILE MEDIA QUERIES */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        text-align: center;
      }
      .catchline-purpose {
        text-align: center;
      }
      .logo {
        max-width: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <div class="catchline-purpose">
        <p class="catchline">Your Reliable On-Call Manpower Provider in Borongan City</p>
        <p class="purpose">We provide skilled and experienced manpower for various services, ensuring quality and efficiency in every job.</p>
      </div>
      <img src="https://github.com/SmartPropertySol/ESamarLots/blob/main/images/logo%20manpower.png?raw=true" alt="Company Logo" class="logo">
    </div>
    <div>
      <img src="https://github.com/SmartPropertySol/ESamarLots/blob/main/images/group%20picture.png?raw=true" alt="Worker Image" style="max-width: 200px; border-radius: 10px;">
    </div>
  </div>

  <h1>Manpower Services</h1>
  <div class="services">
    <button onclick="showWorkers('carpentry')">Carpentry</button>
    <button onclick="showWorkers('masonry')">Masonry</button>
    <button onclick="showWorkers('tiling')">Tiling</button>
    <button onclick="showWorkers('plumber')">Plumber</button>
    <button onclick="showWorkers('rescue')">Motor Rescue</button>
    <button onclick="showWorkers('electrical')">Electrician</button>
    <button onclick="showWorkers('driver')">Driver</button>
  </div>

  <div id="workerContainer" class="worker-container"></div>

  <div class="footer">
    <p>📍 Location: Borongan City, Eastern Samar 6800 | 📞 Phone: 0928-535-4832 | 📧 Facebook: chrisgodino@yahoo.com</p>
  </div>

  <script>
    const workers = {
      carpentry: [
        {name: 'Sanny Bendanillo', rate: '₱700/day', experience: '5 years', status: 'Available', img: 'https://github.com/SmartPropertySol/ESamarLots/blob/main/images/carpenter%20a.png?raw=true'},
        {name: 'Juan Marcos Reyes', rate: '₱500/day', experience: '6 years', status: 'Available', img: 'https://github.com/SmartPropertySol/ESamarLots/blob/main/images/carpenter.png?raw=true'}
      ],
      masonry: [
        {name: 'Carlos San Juan', rate: '₱600/day', experience: '4 years', status: 'Available', img: 'https://github.com/SmartPropertySol/ESamarLots/blob/main/images/mason%20b.png?raw=true'},
        {name: 'Ramon Recto', rate: '₱600/day', experience: '5 years', status: 'Available', img: 'https://github.com/SmartPropertySol/ESamarLots/blob/main/images/mason.png?raw=true'}
      ],
      tiling: [
        {name: 'Jorge Gonzalez', rate: '₱700/day', experience: '7 years', status: 'Available', img: 'https://github.com/SmartPropertySol/ESamarLots/blob/main/images/tiler%20a.png?raw=true'},
        {name: 'Luis Aquino', rate: '₱700/day', experience: '6 years', status: 'Available', img: 'https://github.com/SmartPropertySol/ESamarLots/blob/main/images/tiler%20b.png?raw=true'}
      ]
    };

    function showWorkers(service) {
      let workerHTML = '';
      workers[service].forEach(worker => {
        const fbMessage = `Hello, I would like to book ${worker.name} for ${service}. Please provide availability details.`;
        const fbLink = `https://www.messenger.com/t/EsamarRealtor?text=${encodeURIComponent(fbMessage)}`;

        workerHTML += `
          <div class="worker-card">
            <img src="${worker.img}" alt="${worker.name}">
            <h3>${worker.name}</h3>
            <p>Rate: ${worker.rate}</p>
            <p>Experience: ${worker.experience}</p>
            <p>Status: ${worker.status}</p>
            <button class="book-button" onclick="window.open('${fbLink}', '_blank')">Book</button>
          </div>`;
      });
      document.getElementById('workerContainer').innerHTML = workerHTML;
    }
  </script>
</body>
</html>
